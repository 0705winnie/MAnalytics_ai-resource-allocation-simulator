# Render Blueprint for the single-origin deployment: FastAPI serves the
# built React/Vite frontend (dist/) and /api/*, backed by Neon PostgreSQL.
#
# Secret values (marked "sync: false" below) are NOT stored here and must
# be entered manually in the Render dashboard after the service is created.
# This file only pins non-secret production settings and the exact
# build/start/migration commands.

services:
  - type: web
    name: resource-allocation-simulator
    runtime: python
    plan: free
    buildCommand: "npm ci --legacy-peer-deps && npm run build && pip install -r backend/requirements.txt"
    # The free plan does not support Render's separate preDeployCommand.
    # Run the normal idempotent Alembic upgrade before starting the server so
    # application code is never made live against an older schema.
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      # Fixed production settings (not secret) - see the deployment guide
      # for why these two specifically must be true in production.
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: DISABLE_LEGACY_PROXY_ROUTES
        value: "true"
      - key: MAX_LLM_CALLS_PER_DAY
        value: "50"
      - key: MAX_LLM_INPUT_TOKENS_PER_DAY
        value: "100000"
      # Provider runaway safeguard, separate from the daily student quotas.
      - key: LLM_OUTPUT_TOKEN_SAFETY_CEILING
        value: "4000"
      - key: MAX_LLM_ESTIMATED_COST_PER_DAY
        value: "0.25"
      - key: LLM_USAGE_TIMEZONE
        value: "America/Los_Angeles"
      - key: LLM_INPUT_COST_PER_MILLION_TOKENS
        value: "0.40"
      - key: LLM_OUTPUT_COST_PER_MILLION_TOKENS
        value: "1.60"

      # Values that must be entered manually in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        sync: false
